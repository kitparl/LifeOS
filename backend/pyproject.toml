[tool.ruff]
target-version = "py312"
line-length = 120
src = ["app"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes (unused imports/vars)
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line length — handled by formatter preference, existing code is long
    "B008",   # Depends() in function defaults is FastAPI idiomatic
    "SIM108", # ternary vs if/else — prefer clarity
    # PEP 695 syntax (`type X = ...`, `def f[T]`) needs Python 3.12; code must still run on 3.11 venvs.
    "UP040",
    "UP046",
    "UP047",
    "UP042",  # (str, Enum) -> StrEnum changes str(member) output
]

[tool.ruff.lint.per-file-ignores]
"app/tests/*" = ["B", "SIM"]
"app/core/migrations.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

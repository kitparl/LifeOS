[tool.ruff]
# Production runs Python 3.10 (see scripts/deploy.sh venv); keep pyupgrade from emitting 3.11+ code.
target-version = "py310"
line-length = 120
src = ["app"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes (unused imports/vars)
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line length — handled by formatter preference, existing code is long
    "B008",   # Depends() in function defaults is FastAPI idiomatic
    "SIM108", # ternary vs if/else — prefer clarity
    # Kept in case the target is raised later: PEP 695 syntax needs 3.12, and production is 3.10.
    "UP040",
    "UP046",
    "UP047",
    "UP042",  # (str, Enum) -> StrEnum changes str(member) output
]

[tool.ruff.lint.per-file-ignores]
"app/tests/*" = ["B", "SIM"]
"app/core/migrations.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

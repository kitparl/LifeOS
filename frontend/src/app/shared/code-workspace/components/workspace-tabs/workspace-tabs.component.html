<div class="workspace-tabs" role="tablist" aria-label="Workspace view tabs">
  <button
    *ngFor="let tab of getVisibleTabs()"
    type="button"
    role="tab"
    class="tab-button"
    [class.active]="isActive(tab)"
    [attr.aria-selected]="isActive(tab)"
    [attr.aria-controls]="tab + '-panel'"
    [id]="tab + '-tab'"
    (click)="onTabClick(tab)"
  >
    <!-- Edit Icon -->
    <svg
      *ngIf="tab === 'edit'"
      class="tab-icon"
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
      <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
    </svg>

    <!-- Preview Icon -->
    <svg
      *ngIf="tab === 'preview'"
      class="tab-icon"
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
      <circle cx="12" cy="12" r="3"></circle>
    </svg>

    <!-- Output Icon -->
    <svg
      *ngIf="tab === 'output'"
      class="tab-icon"
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <polyline points="4 17 10 11 4 5"></polyline>
      <line x1="12" y1="19" x2="20" y2="19"></line>
    </svg>

    <span class="tab-label">{{ getTabLabel(tab) }}</span>
  </button>
</div>

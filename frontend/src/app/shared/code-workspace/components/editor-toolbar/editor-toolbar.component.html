<div class="editor-toolbar" [class.theme-dark]="theme === 'dark'" [class.theme-light]="theme === 'light'" *ngIf="visible" role="toolbar" aria-label="Editor formatting toolbar">
  <div class="toolbar-actions">
  <!-- Text Formatting Group -->
  <div class="toolbar-group">
    <button
      type="button"
      class="toolbar-button"
      [disabled]="isDisabled('bold')"
      [title]="getTooltip('bold')"
      (click)="onFormat('bold')"
      aria-label="Bold"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"></path>
        <path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"></path>
      </svg>
    </button>

    <button
      type="button"
      class="toolbar-button"
      [disabled]="isDisabled('italic')"
      [title]="getTooltip('italic')"
      (click)="onFormat('italic')"
      aria-label="Italic"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="4" x2="10" y2="4"></line>
        <line x1="14" y1="20" x2="5" y2="20"></line>
        <line x1="15" y1="4" x2="9" y2="20"></line>
      </svg>
    </button>

    <button
      type="button"
      class="toolbar-button"
      [disabled]="isDisabled('strikethrough')"
      [title]="getTooltip('strikethrough')"
      (click)="onFormat('strikethrough')"
      aria-label="Strikethrough"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17.3 4.9c-2.3-.6-4.4-1-6.2-.9-2.7 0-5.3.7-5.3 3.6 0 1.5 1.8 3.3 3.6 3.9h.2m8.2 3.7c.3.4.4.8.4 1.3 0 2.9-2.7 3.6-5.3 3.6-2.3 0-4.7-.3-6.2-.9M4 11.5h16"></path>
      </svg>
    </button>
  </div>

  <div class="toolbar-divider"></div>

  <!-- Headings Group -->
  <div class="toolbar-group">
    <button
      type="button"
      class="toolbar-button"
      [disabled]="isDisabled('h1')"
      [title]="getTooltip('h1')"
      (click)="onFormat('h1')"
      aria-label="Heading 1"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12h8M4 18V6M12 18V6M17 12h4M21 18V6"></path>
      </svg>
    </button>

    <button
      type="button"
      class="toolbar-button"
      [disabled]="isDisabled('h2')"
      [title]="getTooltip('h2')"
      (click)="onFormat('h2')"
      aria-label="Heading 2"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12h8M4 18V6M12 18V6M17 11h4M21 18h-4v-6l4-1"></path>
      </svg>
    </button>

    <button
      type="button"
      class="toolbar-button"
      [disabled]="isDisabled('h3')"
      [title]="getTooltip('h3')"
      (click)="onFormat('h3')"
      aria-label="Heading 3"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12h8M4 18V6M12 18V6M17 11h4M21 15h-3a2 2 0 0 1 0-4h3v7"></path>
      </svg>
    </button>
  </div>

  <div class="toolbar-divider"></div>

  <!-- Lists Group -->
  <div class="toolbar-group">
    <button
      type="button"
      class="toolbar-button"
      [disabled]="isDisabled('bullet-list')"
      [title]="getTooltip('bullet-list')"
      (click)="onFormat('bullet-list')"
      aria-label="Bullet list"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="8" y1="6" x2="21" y2="6"></line>
        <line x1="8" y1="12" x2="21" y2="12"></line>
        <line x1="8" y1="18" x2="21" y2="18"></line>
        <line x1="3" y1="6" x2="3.01" y2="6"></line>
        <line x1="3" y1="12" x2="3.01" y2="12"></line>
        <line x1="3" y1="18" x2="3.01" y2="18"></line>
      </svg>
    </button>

    <button
      type="button"
      class="toolbar-button"
      [disabled]="isDisabled('numbered-list')"
      [title]="getTooltip('numbered-list')"
      (click)="onFormat('numbered-list')"
      aria-label="Numbered list"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="10" y1="6" x2="21" y2="6"></line>
        <line x1="10" y1="12" x2="21" y2="12"></line>
        <line x1="10" y1="18" x2="21" y2="18"></line>
        <path d="M4 6h1v4M4 10h2M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"></path>
      </svg>
    </button>

    <button
      type="button"
      class="toolbar-button"
      [disabled]="isDisabled('checklist')"
      [title]="getTooltip('checklist')"
      (click)="onFormat('checklist')"
      aria-label="Checklist"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 11l3 3L22 4"></path>
        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
      </svg>
    </button>
  </div>

  <div class="toolbar-divider"></div>

  <!-- Blocks Group -->
  <div class="toolbar-group">
    <button
      type="button"
      class="toolbar-button"
      [disabled]="isDisabled('quote')"
      [title]="getTooltip('quote')"
      (click)="onFormat('quote')"
      aria-label="Quote"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"></path>
        <path d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2h.75c0 2.25.25 4-2.75 4v3c0 1 0 1 1 1z"></path>
      </svg>
    </button>

    <button
      type="button"
      class="toolbar-button"
      [disabled]="isDisabled('inline-code')"
      [title]="getTooltip('inline-code')"
      (click)="onFormat('inline-code')"
      aria-label="Inline code"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="16 18 22 12 16 6"></polyline>
        <polyline points="8 6 2 12 8 18"></polyline>
      </svg>
    </button>

    <button
      type="button"
      class="toolbar-button"
      [disabled]="isDisabled('code-block')"
      [title]="getTooltip('code-block')"
      (click)="onFormat('code-block')"
      aria-label="Code block"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="6" width="20" height="12" rx="2"></rect>
        <path d="M6 10h1M6 14h1M10 10l2 4 2-4"></path>
      </svg>
    </button>

    <button
      type="button"
      class="toolbar-button"
      [disabled]="isDisabled('horizontal-rule')"
      [title]="getTooltip('horizontal-rule')"
      (click)="onFormat('horizontal-rule')"
      aria-label="Horizontal rule"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="12" x2="21" y2="12"></line>
      </svg>
    </button>
  </div>

  <div class="toolbar-divider"></div>

  <!-- Insert Group -->
  <div class="toolbar-group">
    <button
      type="button"
      class="toolbar-button"
      [disabled]="isDisabled('link')"
      [title]="getTooltip('link')"
      (click)="onFormat('link')"
      aria-label="Insert link"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
      </svg>
    </button>

    <button
      type="button"
      class="toolbar-button"
      [disabled]="isDisabled('image')"
      [title]="getTooltip('image')"
      (click)="onFormat('image')"
      aria-label="Insert image"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
        <circle cx="8.5" cy="8.5" r="1.5"></circle>
        <polyline points="21 15 16 10 5 21"></polyline>
      </svg>
    </button>

    <button
      type="button"
      class="toolbar-button"
      [disabled]="isDisabled('table')"
      [title]="getTooltip('table')"
      (click)="onFormat('table')"
      aria-label="Insert table"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2V9M9 21H5a2 2 0 0 1-2-2V9m0 0h18"></path>
      </svg>
    </button>
  </div>

  <div class="toolbar-divider"></div>

  <!-- Edit Group -->
  <div class="toolbar-group">
    <button
      type="button"
      class="toolbar-button"
      [disabled]="readOnly"
      [title]="getTooltip('undo')"
      (click)="onFormat('undo')"
      aria-label="Undo"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 7v6h6"></path>
        <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path>
      </svg>
    </button>

    <button
      type="button"
      class="toolbar-button"
      [disabled]="readOnly"
      [title]="getTooltip('redo')"
      (click)="onFormat('redo')"
      aria-label="Redo"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 7v6h-6"></path>
        <path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"></path>
      </svg>
    </button>

    <button
      type="button"
      class="toolbar-button"
      [title]="getTooltip('find')"
      (click)="onFormat('find')"
      aria-label="Find"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <path d="m21 21-4.35-4.35"></path>
      </svg>
    </button>

    <button
      type="button"
      class="toolbar-button"
      [disabled]="readOnly"
      [title]="getTooltip('replace')"
      (click)="onFormat('replace')"
      aria-label="Replace"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
        <circle cx="11" cy="15" r="2"></circle>
        <path d="m13.3 17.3 1.5 1.5"></path>
      </svg>
    </button>
  </div>
  </div>

  <div class="toolbar-end">
    <ng-container *ngIf="showViewModes">
      <button
        type="button"
        class="toolbar-button view-mode-button"
        [class.active]="viewMode === 'write'"
        [attr.aria-pressed]="viewMode === 'write'"
        aria-label="Edit"
        title="Edit"
        (click)="setViewMode('write')"
      >
        Edit
      </button>
      <button
        type="button"
        class="toolbar-button view-mode-button"
        [class.active]="viewMode === 'split'"
        [attr.aria-pressed]="viewMode === 'split'"
        aria-label="Split"
        title="Edit and preview together"
        (click)="setViewMode('split')"
      >
        Split
      </button>
      <button
        type="button"
        class="toolbar-button view-mode-button"
        [class.active]="viewMode === 'preview'"
        [attr.aria-pressed]="viewMode === 'preview'"
        aria-label="Preview"
        title="Preview only"
        (click)="setViewMode('preview')"
      >
        Preview
      </button>
    </ng-container>

    <ng-container *ngIf="showViewModes && viewMode === 'split'">
      <button
        type="button"
        class="toolbar-button view-mode-button"
        [class.active]="splitOrientation === 'vertical'"
        [attr.aria-pressed]="splitOrientation === 'vertical'"
        aria-label="Vertical preview"
        title="Stack preview below the editor"
        (click)="setSplitOrientation('vertical')"
      >
        Vertical
      </button>
      <button
        type="button"
        class="toolbar-button view-mode-button"
        [class.active]="splitOrientation === 'horizontal'"
        [attr.aria-pressed]="splitOrientation === 'horizontal'"
        aria-label="Horizontal preview"
        title="Show preview beside the editor"
        (click)="setSplitOrientation('horizontal')"
      >
        Horizontal
      </button>
    </ng-container>

    <button
      type="button"
      class="toolbar-button"
      [title]="fullscreen ? 'Exit fullscreen (Esc)' : 'Fullscreen'"
      [attr.aria-label]="fullscreen ? 'Exit fullscreen (Esc)' : 'Fullscreen'"
      (click)="fullscreenToggle.emit()"
    >
      <svg *ngIf="!fullscreen" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 3 21 3 21 9"></polyline>
        <polyline points="9 21 3 21 3 15"></polyline>
        <line x1="21" y1="3" x2="14" y2="10"></line>
        <line x1="3" y1="21" x2="10" y2="14"></line>
      </svg>
      <svg *ngIf="fullscreen" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="4 14 10 14 10 20"></polyline>
        <polyline points="20 10 14 10 14 4"></polyline>
        <line x1="14" y1="10" x2="21" y2="3"></line>
        <line x1="3" y1="21" x2="10" y2="14"></line>
      </svg>
    </button>

    <div class="toolbar-stats" *ngIf="showStats">
      <span class="stats-text">{{ formatStats() }}</span>
    </div>
  </div>
</div>
